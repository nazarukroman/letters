services:
  web:
    image: letters
    container_name: letters
    restart: always
    ports:
      - '${SERVER_PORT:-4000}:4000'
    volumes:
      - ./db/words.db:/app/db/words.db
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
